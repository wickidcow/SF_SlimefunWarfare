# SlimefunWarfare Legacy configuration
# Built-in Gugu/Guizhan automatic updating is intentionally disabled in this fork.
auto-update: false

# Explosion settings
explosions:
  # Chance for reinforced concrete to explode, in percent.
  concrete-explode-chance: 10

# Gun settings
guns:
  # Automatically fire supported guns while sneaking.
  autoshoot: true
  # When enabled, bullets may be consumed from the player's inventory.
  # When disabled, bullets are only consumed from the off-hand.
  # Disable this if inventory scanning causes measurable server load.
  use-bullets-from-inv: true
  # Enables the minimum firing-range restriction used for weapon balance.
  min-range-on: true
  # Allow energy-rifle impacts to create explosions.
  energy-rifle-explosions: false
  # Chance for Borax to drop while breaking stone, in percent (0-100).
  borax-drop-chance: 2.0

# Space / meteor settings
space:
  # Chance for a Segganesson meteor to replace an Osmium meteor, in percent.
  segganesson-chance: 25
  # Minimum delay between activating a Meteor Attractor and meteor impact, in minutes.
  meteor-min-time: 10
  # Maximum delay between activating a Meteor Attractor and meteor impact, in minutes.
  meteor-max-time: 30
  # Meteor Attractor cooldown, in minutes.
  attractor-cooldown: 1
  # Half-width of the square meteor impact area around the attractor.
  # Example: 100 creates a 200x200 possible impact area.
  meteor-drop-radius: 100

# Power-suit settings
suits:
  # Show blue flight particles beneath players using power-suit flight.
  flight-particles: true
  # Use iron blocks instead of netherite blocks at Element Forge corners.
  legacy-element-forge: false

# Legacy radar settings retained for configuration compatibility.
# The radar feature itself was removed upstream.
radar:
  show-players: true
  show-mobs: true
  show-energy-nets: true
  show-gps: true
  # Vertical distance the legacy radar could see.
  y-range: 30
