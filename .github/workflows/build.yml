name: Build SlimefunWarfare Legacy

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slimefunwarfare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_ARTIFACT_VERSION: "1.0.1"
  LEGACY_ARTIFACT: "SF_SlimefunWarfare_Legacy_v1.0.1.jar"

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify Legacy compatibility metadata
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "<paper.version>[26.2.build,)</paper.version>" pom.xml
          grep -Fq "<maven.compiler.release>21</maven.compiler.release>" pom.xml
          grep -Fq "depend: [Slimefun]" src/main/resources/plugin.yml
          grep -Fq "api-version: '26.2'" src/main/resources/plugin.yml
          grep -Fq '<finalName>SF_SlimefunWarfare_Legacy_v${project.version}</finalName>' pom.xml
          grep -Fq '<version>1.0.1</version>' pom.xml
          grep -Fq 'allowed-worlds: "survival_resource"' src/main/resources/config.yml

          if grep -R --line-number -E 'net\.guizhanss|GuizhanUpdater\.start|isPluginEnabled\("GuizhanLibPlugin"\)' src/main/java pom.xml src/main/resources/plugin.yml; then
            echo "Guizhan runtime/update code must not be present in the Legacy fork."
            exit 1
          fi

          if grep -R --line-number "runTaskTimerAsynchronously" src/main/java; then
            echo "Unsafe async Bukkit scheduler usage remains."
            exit 1
          fi

          echo "Legacy compatibility metadata checks passed."

      - name: Build SlimefunWarfare
        run: mvn -B -Dmaven.test.skip=true clean package --file pom.xml

      - name: Stage versioned Legacy JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/SF_SlimefunWarfare_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          OUTPUT="dist/${LEGACY_ARTIFACT}"

          test -s "$JAR"
          cp "$JAR" "$OUTPUT"
          test -s "$OUTPUT"

          echo "Built: $OUTPUT"
          sha256sum "$OUTPUT"
          jar tf "$OUTPUT" | grep -Fq 'plugin.yml'
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: ${LEGACY_ARTIFACT_VERSION}"
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "api-version: '26.2'"

      - name: Upload direct versioned Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LEGACY_ARTIFACT }}
          path: dist/${{ env.LEGACY_ARTIFACT }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish current raw JAR release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${LEGACY_ARTIFACT_VERSION}"
          JAR="dist/${LEGACY_ARTIFACT}"

          cat > release-notes.md <<'EOF'
          # ⚔️ SlimefunWarfare Legacy v1.0.1

          This release adds server-owner world safety controls for SlimefunWarfare's destructive gameplay.

          ## 🛡️ World safety restrictions
          - Destructive Warfare gameplay is now **default-deny outside explicitly allowed worlds**.
          - The default allowed world is **`survival_resource`**.
          - Additional worlds can be added in `config.yml` with `world-restrictions.allowed-worlds`.
          - Blocked players receive a clear message explaining that Warfare items are not allowed in that world and to contact the server owner if they believe it is a mistake.
          - Regular guns and automatic gun fire are blocked before ammunition is consumed.
          - Energy rifles are blocked before charge is consumed.
          - Energy blades are blocked before charge is consumed.
          - Chemical grenades are blocked before the grenade item is consumed.
          - Grenade impact effects are re-checked before creating explosions or area-effect clouds.
          - Nuclear bombs are blocked before activation and have additional TNT-prime / explosion-prime safety catches.
          - Pyro Powder combustion explosions are blocked outside allowed worlds.
          - Energy-rifle impact explosions are blocked outside allowed worlds.
          - Meteor Attractor activation and delayed meteor impact are both checked so scheduled strikes cannot bypass the world rule.

          ## ✅ Compatibility
          - Paper 26.2 API target.
          - Java 25 build environment with Java 21-compatible addon bytecode.
          - Slimefun Legacy remains the primary runtime target.
          - Existing InfinityExpansion/InfinityExpansion2, DynaTech, and TownyFlight integration behavior is retained.

          ## 📥 Download
          Use the attached raw server plugin directly:

          `SF_SlimefunWarfare_Legacy_v1.0.1.jar`

          Place it directly in your server's `plugins` folder. No archive extraction is required.

          ---

          Full credit remains with **Seggan** for creating SlimefunWarfare and **LobbyTech-MC** for maintaining the intermediate modernized fork used as this Legacy branch's starting point.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --title "SlimefunWarfare Legacy v${LEGACY_ARTIFACT_VERSION}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SlimefunWarfare Legacy v${LEGACY_ARTIFACT_VERSION}" --notes-file release-notes.md --latest
          fi
