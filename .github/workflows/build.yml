name: Build SlimefunWarfare Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slimefunwarfare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_ARTIFACT_VERSION: "1.0.4"
  OUTPUT_NAME: "SF_SlimefunWarfare1.0.4.jar"

jobs:
  build:
    name: Build universal 1.21.11-26.2 JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Legacy compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.4</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Fq 'depend: [Slimefun]' src/main/resources/plugin.yml
          grep -Fq '  - ItemsAdder' src/main/resources/plugin.yml
          grep -Fq '  - SlimeTinker' src/main/resources/plugin.yml
          if grep -R --line-number -E 'net\.guizhanss|GuizhanUpdater\.start|isPluginEnabled\("GuizhanLibPlugin"\)' src/main/java pom.xml src/main/resources/plugin.yml; then exit 1; fi
          if grep -R --line-number 'runTaskTimerAsynchronously' src/main/java; then exit 1; fi
      - name: Verify Paper 1.21.11 compile baseline
        run: mvn -B -Dmaven.test.skip=true clean package --file pom.xml
      - name: Verify Paper 26.2 compile compatibility
        run: mvn -B -Dmaven.test.skip=true -Dpaper.version=26.2.build.111-stable clean package --file pom.xml
      - name: Build release JAR from 1.21.11 baseline
        run: mvn -B -Dmaven.test.skip=true -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package --file pom.xml
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="target/SF_SlimefunWarfare_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          test -s "$SOURCE"
          cp "$SOURCE" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$JAR" io.github.seggan.slimefunwarfare.SlimefunWarfare | grep -Fq 'major version: 65'
          jar tf "$JAR" | grep -Fq 'io/github/seggan/slimefunwarfare/ItemsAdderIntegration.class'
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="Compatibility release for Minecraft/Purpur 1.21.11 through Paper/Purpur 26.2. Keeps Java 21 bytecode and existing ItemsAdder, InfinityExpansion and SlimeTinker integration."
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$JAR" --clobber; else gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_SlimefunWarfare $TAG"; fi
