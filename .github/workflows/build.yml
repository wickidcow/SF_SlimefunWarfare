name: Build SlimefunWarfare Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slimefunwarfare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_ARTIFACT_VERSION: "1.0.1"
  OUTPUT_NAME: "SF_SlimefunWarfare1.0.1.jar"

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Legacy compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.1</version>' pom.xml
          grep -Fq 'depend: [Slimefun]' src/main/resources/plugin.yml
          grep -Fq 'allowed-worlds: "survival_resource"' src/main/resources/config.yml
          if grep -R --line-number -E 'net\.guizhanss|GuizhanUpdater\.start|isPluginEnabled\("GuizhanLibPlugin"\)' src/main/java pom.xml src/main/resources/plugin.yml; then exit 1; fi
          if grep -R --line-number 'runTaskTimerAsynchronously' src/main/java; then exit 1; fi
      - name: Build SlimefunWarfare
        run: mvn -B -Dmaven.test.skip=true clean package --file pom.xml
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="target/SF_SlimefunWarfare_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          test -s "$SOURCE"
          cp "$SOURCE" "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fq 'plugin.yml'
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Publish raw JAR release asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$JAR" --clobber; else gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --generate-notes --title "SF_SlimefunWarfare $TAG"; fi
